<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>Some Settings · preview</title>
<style>
/* 这张图不自己画界面，而是把思源真正的那套样式搬过来：
   变量与组件规则逐条抄自 siyuan-note/siyuan 的 app/appearance/themes/daylight/theme.css
   与 app/src/assets/scss 下的 _dialog / _form / _switch / _select / _text-field /
   _button / _list / _function / business/_config 等文件，控制面板部分的样式则直接取自
   插件自己的 src/core/ui.ts（PANEL_CSS，见下方 …PANEL_CSS 一节，与仓库里那份逐字一致）。
   面板标记也照 src/core/ui.ts 的构造函数拼（行结构与类名一一对应），
   所以图里的面板就是插件在思源里真正渲染出来的那一块。 */
:root {
    /* 主色 */
    --b3-theme-primary: #3575f0;
    --b3-theme-primary-light: rgba(53, 117, 240, .54);
    --b3-theme-primary-lighter: rgba(53, 117, 240, .38);
    --b3-theme-primary-lightest: rgba(53, 117, 240, .12);
    --b3-theme-secondary: #ff9200;
    --b3-theme-background: #fff;
    --b3-theme-background-light: #dfe0e1;
    --b3-theme-surface: #f6f6f6;
    --b3-theme-surface-light: rgba(243, 243, 243, .86);
    --b3-theme-surface-lighter: #e0e0e0;
    --b3-theme-error: #d23f31;
    --b3-theme-success: #65b84d;

    /* 文字颜色 */
    --b3-theme-on-primary: #fff;
    --b3-theme-on-secondary: #fff;
    --b3-theme-on-background: #222;
    --b3-theme-on-surface: #5f6368;
    --b3-theme-on-surface-light: rgba(95, 99, 104, .68);
    --b3-theme-on-surface-lighter: #c8ccd6;
    --b3-theme-on-error: #fff;

    /* 字体（:root:lang(zh-CN) 那一档）。截图时按思源在 Windows 上的解析结果取字：
       拉丁落到 Arial 一族、中文落到微软雅黑，多行文案的折行位置才和真机一致 */
    /* 字体（:root:lang(zh-CN) 那一档） */
    --b3-font-family-emoji-reset: "Emojis Additional", "Emojis Reset";
    --b3-font-family-default: var(--b3-font-family-emoji-reset), BlinkMacSystemFont, Helvetica, "PingFang SC", "Luxi Sans", "DejaVu Sans", arial, "Microsoft Yahei", "Hiragino Sans GB", "Source Han Sans SC", sans-serif, emojis;
    --b3-font-family: var(--b3-font-family-default);
    --b3-font-size: 14px;

    /* 背景 */
    --b3-body-background: #EBECF0;

    /* 顶部工具栏 */
    --b3-toolbar-color: var(--b3-theme-on-surface-light);
    --b3-toolbar-hover: rgba(255, 255, 255, .68);
    --b3-toolbar-left-mac: 74px;

    /* 线条 */
    --b3-border-color: var(--b3-theme-surface-lighter);
    --b3-border-radius: 6px;
    --b3-border-radius-s: 3px;
    --b3-border-radius-b: 12px;

    /* 列表 */
    --b3-list-hover: rgba(0, 0, 0, .075);
    --b3-list-icon-hover: rgba(33, 34, 36, .1);

    /* 菜单 / 提示 / 遮罩 */
    --b3-menu-background: var(--b3-theme-background);
    --b3-tooltips-background: #312f35;
    --b3-tooltips-color: var(--b3-theme-background-light);
    --b3-mask-background: rgba(220, 220, 220, .4);

    /* 下拉菜单 */
    --b3-select-background: url("data:image/svg+xml;utf8,<svg fill='rgba(95, 99, 104, .68)' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>") no-repeat right 2px center var(--b3-menu-background);

    /* switch */
    --b3-switch-background: #e1e3e1;
    --b3-switch-border: var(--b3-theme-on-surface-light);
    --b3-switch-hover: rgba(31, 31, 31, .06);
    --b3-switch-checked: #fff;
    --b3-switch-checked-background: var(--b3-theme-primary);
    --b3-switch-checked-hover: #d3e3fd;
    --b3-switch-checked-hover2: rgba(31, 31, 31, .06);

    /* 阴影 / 动画 */
    --b3-point-shadow: 0 0 1px 0 rgba(0, 0, 0, .1), 0 0 2px 0 rgba(0, 0, 0, .2);
    --b3-dialog-shadow: 0 8px 24px rgba(0, 0, 0, .2);
    --b3-button-shadow: 0 1px 2px 0 rgb(0 0 0 / .3), 0 1px 3px 1px rgb(0 0 0 / .15);
    --b3-button-active-shadow: 0 2px 3px 1px rgb(0 0 0 / .3), 0 2px 4px 2px rgb(0 0 0 / .15);
    --b3-transition: all .2s cubic-bezier(0, 0, .2, 1) 0ms;
}

/* ------------------------------------------------------------ 内核基础（util/_reset.scss） */
html {
    -webkit-text-size-adjust: 100%;
    height: 100%;
    box-sizing: border-box;
}
body {
    text-rendering: optimizeLegibility;
    margin: 0;
    font-family: var(--b3-font-family);
    font-size: var(--b3-font-size);
    color: var(--b3-theme-on-background);
    background-color: var(--b3-body-background);
    height: 100%;
    box-sizing: border-box;
    max-height: 100%;
    overflow: hidden;
}
svg {
    fill: currentColor;
    display: inline-block;
}
ul {
    margin: 0;
    padding: 0;
}
a {
    text-decoration: none;
    color: var(--b3-theme-primary);
}

/* 预览画布：集市要求 1024x768，overflow 裁掉窗口之外的部分，截图不需要整页 */
body {
    width: 1024px;
    height: 768px;
    position: relative;
}

/* ------------------------------------------------------------ 工具类（util/_function.scss） */
.fn__flex { display: flex; }
.fn__flex-center { align-self: center; }
.fn__flex-1 { flex: 1; min-width: .1px; overflow: auto; min-height: .1px; }
.fn__flex-column { min-height: 100%; display: flex; flex-direction: column; }
.fn__flex-shrink { flex-shrink: 0; }
.fn__flex-wrap { flex-wrap: wrap; }
.fn__none { display: none !important; }
.fn__block { width: 100%; }
.fn__size200 { width: 200px; flex-shrink: 0; }
.fn__space { width: 8px; display: inline-block; flex-shrink: 0; }
.fn__ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.ft__on-surface { color: var(--b3-theme-on-surface); }

/* ------------------------------------------------------------ 弹窗（component/_dialog.scss） */
.b3-dialog {
    position: fixed;
    top: 0;
    left: 0;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    display: flex;
    font-size: var(--b3-font-size, 16px);
}
.b3-dialog__scrim {
    background-color: var(--b3-mask-background);
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 1;
}
.b3-dialog__container {
    outline: none;
    border-radius: var(--b3-border-radius-b);
    background-color: var(--b3-theme-surface, Canvas);
    position: relative;
    box-shadow: var(--b3-dialog-shadow);
    display: flex;
    flex-direction: column;
    flex-grow: 0;
    flex-shrink: 0;
    box-sizing: border-box;
    max-width: 88vw;
    border: 1px solid var(--b3-theme-surface-lighter);
}
.b3-dialog__header {
    cursor: default;
    padding: 9px 16px;
    line-height: 24px;
    font-size: 16px;
    font-weight: 500;
    border-bottom: 1px solid var(--b3-theme-surface-lighter);
}
.b3-dialog__body {
    overflow: auto;
    flex: 1;
    display: flex;
    flex-direction: column;
}
.b3-dialog__content {
    padding: 16px 16px;
    word-break: break-all;
    flex: 1;
    overflow: auto;
}
.b3-dialog__action {
    padding: 7px 16px;
    border-top: 1px solid var(--b3-theme-surface-lighter);
    display: flex;
    flex-shrink: 0;
    flex-wrap: wrap;
    align-items: center;
    justify-content: flex-end;
    box-sizing: border-box;
    user-select: none;
}

/* ------------------------------------------------------------ 设置行（component/_form.scss + business/_config.scss） */
.b3-label {
    border-bottom: 1px solid var(--b3-border-color);
    padding: 16px 24px;
    line-height: 20px;
}
.b3-label__text {
    color: var(--b3-theme-on-surface);
    font-size: 14px !important;
    margin-top: 4px;
    overflow: hidden !important;
}
.b3-label:last-child {
    border-bottom: 0;
}
.config-items {
    background-color: var(--b3-theme-surface);
    border-radius: var(--b3-border-radius-b);
}
.config-items .config-item.config-item--last-visible {
    border-bottom: 0;
}
.config-items .b3-label__text {
    font-size: 13px !important;
}
.config-wrap,
.config-item.fn__flex,
.config-item > .fn__flex {
    align-items: center;
}
.config-item__main {
    font-size: 14px;
    min-height: auto;
    overflow: visible;
}

/* ------------------------------------------------------------ 开关（component/_switch.scss） */
.b3-switch {
    flex-shrink: 0;
    -webkit-appearance: none;
    width: 26px;
    height: 16px;
    border: 1px solid var(--b3-switch-border);
    border-radius: var(--b3-border-radius-b);
    margin: 0;
    outline: none;
    display: inline-block;
    position: relative;
    cursor: pointer;
    background-color: var(--b3-switch-background);
    overflow: inherit;
    user-select: none;
}
.b3-switch::after {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 1;
    content: "";
    background-color: var(--b3-switch-border);
    display: block;
    left: 7px;
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    transition: left 80ms linear, background-color 80ms linear, width 80ms linear, height 80ms linear;
}
.b3-switch:checked {
    background-color: var(--b3-switch-checked-background);
    border-color: transparent;
}
.b3-switch:checked::after {
    background-color: var(--b3-switch-checked);
    height: 12px;
    width: 12px;
    left: 17px;
}

/* ------------------------------------------------------------ 下拉（component/_select.scss） */
.b3-select {
    border: 0;
    border-radius: var(--b3-border-radius);
    padding: 4px 26px 4px 8px;
    box-sizing: border-box;
    line-height: 20px;
    color: var(--b3-theme-on-background);
    transition: box-shadow 120ms 0ms cubic-bezier(0, 0, .2, 1), background-color .2s cubic-bezier(0, 0, .2, 1) 0ms;
    height: 28px;
    font-size: 14px;
    box-shadow: inset 0 0 0 1px var(--b3-border-color);
    background: var(--b3-select-background);
    appearance: none;
    cursor: pointer;
    overflow: hidden;
}

/* ------------------------------------------------------------ 输入框（component/_text-field.scss） */
.b3-text-field {
    border: 0;
    border-radius: var(--b3-border-radius);
    outline: 1px solid var(--b3-border-color);
    outline-offset: -1px;
    box-shadow: none;
    padding: 4px 8px;
    line-height: 20px;
    box-sizing: border-box;
    color: var(--b3-theme-on-background);
    transition: box-shadow 120ms 0ms cubic-bezier(0, 0, .2, 1), outline-color 120ms 0ms cubic-bezier(0, 0, .2, 1);
    background-color: var(--b3-theme-background);
    -webkit-appearance: none;
    font-variant-ligatures: none;
    font-size: 14px;
}

/* ------------------------------------------------------------ 按钮（component/_button.scss） */
.b3-button {
    cursor: pointer;
    color: var(--b3-theme-on-primary, ButtonText);
    border-radius: var(--b3-border-radius, 4px);
    line-height: 20px;
    padding: 4px 8px;
    background-color: var(--b3-theme-primary, ButtonFace);
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: box-shadow 280ms ease;
    border: 0;
    box-sizing: border-box;
    text-align: center;
}
.b3-button svg {
    height: 16px;
    width: 16px;
    margin-right: 4px;
    flex-shrink: 0;
}
.b3-button--text {
    color: var(--b3-theme-primary);
    background-color: transparent;
}
.b3-button--cancel {
    color: var(--b3-theme-on-surface);
    background-color: transparent;
}
.b3-button--outline {
    color: var(--b3-theme-primary, ButtonText);
    box-shadow: inset 0 0 0 .6px var(--b3-theme-primary);
    background-color: transparent;
    text-decoration: none;
}
.b3-button--pink {
    color: var(--b3-theme-on-secondary);
    background-color: #ea4aaa;
}

/* ------------------------------------------------------------ 列表（component/_list.scss） */
.b3-list--background .b3-list-item {
    border-radius: var(--b3-border-radius);
}
.b3-list--background .b3-list-item:hover:not(.b3-list-item--focus),
.b3-list--background .b3-list-item--focus {
    background-color: var(--b3-list-hover);
}
.b3-list-item {
    line-height: var(--b3-ui-list-height, 28px);
    min-height: var(--b3-ui-list-height, 28px);
    padding: 0 4px;
    display: flex;
    cursor: pointer;
    align-items: center;
    position: relative;
    background-color: transparent;
    text-align: left;
    border: 0;
    color: var(--b3-theme-on-background);
    margin: 1px 8px;
}
.b3-list-item__graphic {
    margin-right: 4px;
    flex-shrink: 0;
    padding: 0 1px;
    height: 16px;
    width: 16px;
    line-height: 16px;
    font-size: 12px;
    font-family: var(--b3-font-family-emoji);
}
.b3-list-item__graphic svg {
    width: 16px;
    height: 16px;
}
.b3-list-item__text {
    flex: 1;
    background-color: transparent;
    text-align: left;
    border: 0;
    padding: 0;
    color: var(--b3-theme-on-background);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

/* ------------------------------------------------------------ 思源窗口（business/_layout.scss + main/_main.scss） */
.toolbar {
    box-sizing: border-box;
    height: 32px;
    line-height: 32px;
    padding: 0 5px 0 var(--b3-toolbar-left-mac);
    display: flex;
    align-items: center;
    overflow: hidden;
}
.toolbar #drag {
    color: var(--b3-toolbar-color);
    user-select: none;
    text-align: center;
    white-space: nowrap;
    align-self: center;
    font-size: 12px;
    flex: 1;
    min-width: 148px;
    box-sizing: border-box;
}
.toolbar__item {
    flex-shrink: 0;
    cursor: pointer;
    color: var(--b3-toolbar-color);
    padding: 4px;
    margin: 2px;
    border-radius: var(--b3-border-radius);
    box-sizing: border-box;
    transition: var(--b3-transition);
    display: flex;
    align-items: center;
    align-self: center;
    background-color: transparent;
    border: 0;
    line-height: 16px;
    height: 23.5px;
}
.toolbar__item svg {
    height: 15.5px;
    width: 15.5px;
}
.toolbar__svg {
    width: 12px;
    height: 15.5px;
    margin: 0 -3px 0 2px;
    opacity: .54;
}
.toolbar__item--disabled {
    opacity: .54;
    cursor: not-allowed;
}
.toolbar__item--win {
    padding: 9px 13px;
    margin: 0;
    height: 31.5px;
    border-radius: 0;
}
.toolbar__item--close {
    padding: 9px 15px;
    margin: 0;
    height: 31.5px;
    border-radius: 0;
}

.layout {
    display: flex;
    height: calc(768px - 32px - 32px);
    overflow: hidden;
}
.dock {
    display: flex;
    user-select: none;
    box-sizing: border-box;
    width: 42px;
    flex-direction: column;
    height: 100%;
    min-height: 0;
    overflow: hidden;
}
.dock svg {
    height: 16px;
    width: 17.5px;
}
.dock__item {
    padding: 5px;
    color: var(--b3-theme-on-surface-light);
    display: flex;
    border-radius: var(--b3-border-radius);
    margin: 7px;
    cursor: pointer;
}
.dock__split {
    height: 17px;
    position: relative;
}
.dock__split::after {
    height: 1px;
    width: 22px;
    background: var(--b3-theme-on-surface-lighter);
    content: "";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border-radius: var(--b3-border-radius);
}
.layout__center {
    flex: 1;
    min-width: 0;
    border-radius: var(--b3-border-radius-b);
    background-color: var(--b3-theme-background);
    overflow: hidden;
}
.layout-tab-bar {
    list-style: none;
    align-items: center;
    overflow: hidden;
    position: relative;
    background-color: var(--b3-theme-background);
    border-bottom: 1px solid var(--b3-theme-background-light);
    padding: 0 4px;
    display: flex;
}
.layout-tab-bar .item {
    line-height: 22px;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    transition: var(--b3-transition);
    min-height: 29px;
    position: relative;
    max-width: 186px;
    flex-shrink: 0;
    overflow: hidden;
    color: var(--b3-theme-on-surface);
    margin: 6px 4px;
    border-radius: var(--b3-border-radius);
}
.layout-tab-bar .item--focus {
    background-color: var(--b3-theme-surface-light);
    box-shadow: 0 0 0 1px var(--b3-border-color) inset;
}
.layout-tab-bar .item__close {
    display: flex;
    align-items: center;
    padding-right: 8px;
}
.layout-tab-bar .item__close svg {
    width: 12px;
    height: 12px;
    opacity: .68;
}
.layout-tab-bar .item__graphic {
    flex-shrink: 0;
    height: 14px;
    width: 14px;
    margin: 0 4px 0 8px;
}
.layout-tab-bar .item__text {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    padding: 0 8px;
}
.protyle-mock {
    padding: 24px 96px 0;
}
.protyle-mock__title {
    font-size: 25px;
    font-weight: 600;
    line-height: 1.4;
}
.protyle-mock__p {
    margin-top: 12px;
    font-size: 16px;
    line-height: 1.625;
}
.status {
    box-sizing: border-box;
    z-index: 2;
    height: 32px;
    line-height: 32px;
    padding: 0 7px;
    display: flex;
    align-items: center;
}
.status__msg {
    color: var(--b3-theme-on-surface);
    white-space: nowrap;
    text-overflow: ellipsis;
    overflow: hidden;
    padding-left: 5px;
    font-size: 12px;
}
.status__counter {
    display: flex;
    flex-shrink: 0;
    font-size: 12px;
    color: var(--b3-theme-on-surface);
    gap: 12px;
    margin-left: auto;
}

/* ------------------------------------------------------------ 插件设置面板（src/core/ui.ts 的 PANEL_CSS，逐字照搬） */
.some-settings-panel {
    display: flex;
    height: 100%;
}
/* 移动端：顶部页签栏 + 内容，上下分栏，且按内容自然高度排版。
   宿主把 Setting 渲染成底部抽屉时，抽屉高度是「内容的自然高度」再按视口裁限，
   所以这里绝不能写死高度（height: 100% 在自动高度的父级里会退化成 auto，
   抽屉会塌成一条）；整块由宿主的内容区滚动，页签栏吸顶。 */
.some-settings-panel--mobile {
    flex-direction: column;
    height: auto;
}
/* 页签栏吸顶后必须有底色遮住从它下面滚过的行。取 --b3-theme-surface，
   与弹窗容器（含移动端底部抽屉）的底色完全一致；不能用内核给 .layout-tab-bar 的
   --b3-theme-background：深色主题下 1e1e1e 与 2c2c2c、浅色主题下 fff 与 f6f6f6
   都不一样，页签栏会变成标题下面一条明显的色带。
   同理不要圆角：本面板上面还有标题栏，不在容器圆角上，那圈圆角只会把容器底色从两个角上露出来。 */
.some-settings-panel--mobile > .layout-tab-bar {
    position: sticky;
    top: 0;
    z-index: 2;
    flex-shrink: 0;
    background-color: var(--b3-theme-surface);
    /* 页签按原生功能区划分后有七个，一屏放不下：整条可以左右滑动，
       每一项按内容给宽度（flex: 0 0 auto），不做等分也不换行。
       刻意不加 scroll-snap：吸附会在每一项上顿一下，手指的惯性被打断，滑起来是「一格一格」的黏感；
       页签本来就短，靠惯性滑到看得见的位置比被吸附到整项更顺手。 */
    overflow-x: auto;
    overflow-y: hidden;
    overscroll-behavior-x: contain;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
}
.some-settings-panel--mobile > .layout-tab-bar::-webkit-scrollbar {
    display: none;
}
.some-settings-panel--mobile > .layout-tab-bar > .some-settings-panel__tab {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    /* 每项一个能整块点中的宽度：图标 + 四个汉字上下，再窄就只能靠精准点字 */
    min-width: 6.5rem;
    padding: 0 10px;
}
/* 页签图标：两端同一份，移动端不再只有文字 */
.some-settings-panel__tab-icon {
    width: 16px;
    height: 16px;
    flex: 0 0 auto;
    margin-inline-end: 6px;
    fill: currentColor;
}
/* 桌面端：页签列表 + 内容，左右分栏。宽度、内边距与分隔线照抄内核设置的
   .config__panel > .config__side（这里按「功能 / 界面 / 关于」三个短标签收窄到 220px）。 */
.some-settings-panel__side {
    flex: 0 0 auto;
    width: 220px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
    padding: 12px;
    box-sizing: border-box;
    border-right: 1px solid var(--b3-border-color);
    user-select: none;
}
.some-settings-panel__tabs {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    margin: 0;
    padding: 0;
    list-style: none;
}
.some-settings-panel__side .b3-list-item {
    line-height: 32px;
    margin: 8px;
}
.some-settings-panel__side .b3-list-item__graphic {
    padding: 0 6px 0 4px;
}
/* 页签内容：每一页都铺满内容区，只有当前页留在文档流里（其余是 fn__none），
   滚动各自独立 —— 弹窗自己的 .b3-dialog__content 不再滚动。 */
.some-settings-panel__views {
    position: relative;
    flex: 1;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
}
.some-settings-panel__view {
    position: absolute;
    inset: 0;
    overflow: auto;
    box-sizing: border-box;
    padding: 24px;
}
/* 移动端：整块面板按自然高度排版，滚动交给宿主的内容区（抽屉高度就是量它量出来的）。
   所以这里把「每页绝对定位 + 各自滚动」拆掉，改成正常文档流；页签栏的吸顶由上面那条规则负责。 */
.some-settings-panel--mobile > .some-settings-panel__views {
    position: static;
    flex: 0 0 auto;
    overflow: visible;
}
.some-settings-panel--mobile > .some-settings-panel__views > .some-settings-panel__view {
    position: static;
    overflow: visible;
    padding: 8px;
}
/* 设置行不要卡片底色与大圆角 */
.some-settings-panel .config-items {
    background-color: transparent;
    border-radius: 0;
}
/* 子设置行缩进 -----------------------------------------------------------
   功能名那一行（__sub）保持原样，它下面的参数行、说明块、动作行统一缩进一小格，
   「哪个设置属于哪个功能」一眼就看得出来。缩进加在整行上而不是只挪文案：
   移动端控件会折到第二行，整行一起缩进才对齐；行间的分割线仍由内核画满整行。
   基数跟着行自己的内边距走 —— 桌面端内核给 .b3-label 的是 24px，
   窄屏下面板把行压到 10px（见下面的媒体查询），所以两边各写一条。 */
.some-settings-panel .config-items > .some-settings-panel__child {
    /* 引导线的定位基准：竖线与横折都相对这一行摆 */
    position: relative;
    padding-inline-start: 40px;
}
/* 层级引导线 -------------------------------------------------------------
   缩进之后「这些行属于上面那个功能」还差一口气，再补一条树形引导线：
   一条竖线把同一功能的所有子行串起来，每一行在自己的垂直中线处伸出一小段横折指向文案。
   线画在子行自己的伪元素上，所以它天然从功能名那一行的下沿开始，
   不需要为它加任何分组容器（页签里的行必须保持平铺，多一层就多一层层级）。
   最后一个子行带 LAST_CHILD_CLASS（由 markLastChildRow 在拼行时打上），
   竖线只画到折角处、收成 └，否则它会一直画到行的下沿，看着像下面还有内容没显示完。
   颜色取 --b3-border-color，与行间分割线同色，深浅主题都跟着思源走。 */
.some-settings-panel .config-items > .some-settings-panel__child::before,
.some-settings-panel .config-items > .some-settings-panel__child::after {
    content: "";
    position: absolute;
    pointer-events: none;
    background-color: var(--b3-border-color);
}
/* 竖线：从行顶画到行底，与上下相邻的子行接成一条连续的线 */
.some-settings-panel .config-items > .some-settings-panel__child::before {
    inset-inline-start: 20px;
    top: 0;
    bottom: 0;
    width: 1px;
}
/* 横折：从竖线伸到文案左侧，留一小段空隙，不贴字 */
.some-settings-panel .config-items > .some-settings-panel__child::after {
    inset-inline-start: 20px;
    top: 50%;
    width: 10px;
    height: 1px;
}
/* 最后一行：竖线到折角为止 */
.some-settings-panel .config-items > .some-settings-panel__child--last::before {
    bottom: 50%;
}
/* 面板里的文案统一常规字重：功能名（父项）与它下面的子设置项、动作行都不加粗。
   「哪个设置属于哪个功能」由子行的缩进与左侧那条层级引导线表达，不再靠字重——
   加粗功能名会把两侧的视觉重心都拉到标题上，参数行被压成一片灰。
   因此这里不给任何一类行单独调字重；说明（.b3-label__text）只换颜色，与内核一致。 */
.some-settings-panel .config-item__main .b3-label__text {
    color: var(--b3-theme-on-surface);
}
.some-settings-panel .config-item:last-child,
.some-settings-panel .config-item--last-visible {
    border-bottom: 0;
}
.some-settings-panel .some-settings-panel__empty {
    flex: 1 1 auto;
    min-width: 0;
    padding: 18px 12px;
    text-align: center;
    color: var(--b3-theme-on-surface);
    opacity: .7;
}
.some-settings-panel .some-settings-panel__note .b3-label__text {
    margin-top: 0;
}
.some-settings-panel .some-settings-panel__note .b3-label__text + .b3-label__text {
    margin-top: 6px;
}
/* 说明块的动作按钮：与面板里其它行同一套位置 —— 文字让出右侧，按钮竖着叠在右边，
   每颗 200px、整列上下居中（「导出配置」那些按钮正是这个位置和宽度）。
   文字因此会被压窄一点，这是对的：一段说明配一组入口，本来就该是「左文右按钮」。
   窄屏放不下，由下面的媒体查询改回「文字在上、按钮整行在下」。 */
.some-settings-panel .some-settings-panel__note {
    display: flex;
    align-items: center;
    gap: 8px;
}
.some-settings-panel .some-settings-panel__note-body {
    flex: 1 1 0;
    min-width: 0;
}
.some-settings-panel .some-settings-panel__note-actions {
    display: flex;
    flex: 0 0 200px;
    width: 200px;
    flex-direction: column;
    gap: 8px;
}
.some-settings-panel .some-settings-panel__note-actions .b3-button {
    width: 100%;
    box-sizing: border-box;
}
.some-settings-panel .some-settings-panel__note a {
    color: var(--b3-theme-primary);
    word-break: break-all;
}

/* 弹窗容器宽度 -----------------------------------------------------------
   真正的宽度由 setting-dialog.ts 的 applyPanelWidth() 量完视口写成行内样式，
   因为 CSS 这条路已经证实不可靠：Dialog 把宽度写成容器上的行内样式
   （桌面 768px、移动端 92vw），而内核给 .b3-dialog__container 设了
   flex-shrink: 0 —— 行内宽度 + 不收缩，视口一旦更窄容器就整块溢出屏幕。
   这里只留一条兜底：CSS 没生效时也别让它宽过视口。
   必须 !important —— 内核自己也用同优先级的 max-width 声明这一条。 */
.some-settings-dialog.b3-dialog__container {
    max-width: 100% !important;
    min-width: 0;
}

/* 单位标签：内核给 .b3-dialog__content 设了 word-break: break-all，
   容器一旦容不下，连 "ms" 这种两个字母的单位都会被从中间断成两行。
   nowrap 才是止血点（keep-all 只约束 CJK，对 "ms" 无效）。 */
.some-settings-panel .config-item__unit {
    flex: 0 0 auto;
    white-space: nowrap;
}

/* 窄面板适配 -------------------------------------------------------------
   弹窗宽度由用户拖拽决定，思源给 .config-item__main 的 flex:1 在窄宽度下
   会把文案挤成一列单字。这里给文案一个最小宽度，空间不够就让整行折成
   上下两段（文案在上、控件在下并撑满宽度），而不是把字竖向排开。 */
.some-settings-panel .config-item,
.some-settings-panel .config-item__main {
    min-width: 0;
}
.some-settings-panel label.config-item > .config-item__main:first-child,
.some-settings-panel div.config-item > .config-item__main:first-child {
    flex: 1 1 12rem;
}
.some-settings-panel .config-item .fn__size200,
.some-settings-panel .config-item .config-item__number {
    max-width: 100%;
}
.some-settings-panel .config-item .b3-select,
.some-settings-panel .config-item .b3-text-field {
    min-width: 0;
}
.some-settings-panel .b3-switch {
    margin-inline-start: auto;
}

/* 移动端 / 窄窗口 ---------------------------------------------------------
   断点与内核一致（内核在 750px 以下把 .config-item 折成上下两段、输入框撑满整行）。
   关键是行内边距：内核给 .b3-label 的 16px 24px 在手机上会吃掉近一半屏宽，
   上下各 16px 还会把每行之间撑出 32px 的空隙——这正是"边距特别大"的主因。
   选择器比内核的 .config__tab-container .b3-label 多一级，
   不论样式表加载顺序如何都稳定生效。作用域用容器上的 some-settings-dialog 类限定。 */
@media (max-width: 750px) {
    .some-settings-dialog .b3-dialog__action {
        padding: 7px 8px;
    }
    /* 页签内容自己也收到 8px：弹窗内容区已经不再留内边距（见 applyDesktopLayout） */
    .b3-dialog__body .some-settings-panel__view {
        padding: 8px;
    }
    /* 桌面端把窗口缩到 750px 以下时，侧栏收成一列只有图标的页签（内核设置页同款做法），
       否则 220px 的侧栏会把内容区挤没。 */
    .b3-dialog__body .some-settings-panel__side {
        width: auto;
        padding: 12px 4px;
    }
    .b3-dialog__body .some-settings-panel__side .b3-list-item {
        width: 24px;
        margin: 8px auto;
    }
    .b3-dialog__body .some-settings-panel__side .b3-list-item__text {
        display: none;
    }
    .b3-dialog__body .some-settings-panel .b3-label.config-item,
    .b3-dialog__body .some-settings-panel .config-item {
        padding: 8px 10px;
    }
    /* 子行缩进跟着窄屏这 10px 走；选择器多带 .config-item 一级，才压得过上面那条简写 */
    .b3-dialog__body .some-settings-panel .b3-label.config-item.some-settings-panel__child {
        padding-inline-start: 26px;
    }
    /* 引导线跟着窄屏这 26px 一起收：竖线挪到 12px，横折到 20px 为止，
       与文案之间同样留 6px。缩进改了这里不改，线会压到文字上。 */
    .b3-dialog__body .some-settings-panel .config-items > .some-settings-panel__child::before,
    .b3-dialog__body .some-settings-panel .config-items > .some-settings-panel__child::after {
        inset-inline-start: 12px;
    }
    .b3-dialog__body .some-settings-panel .config-items > .some-settings-panel__child::after {
        width: 8px;
    }
    .b3-dialog__body .some-settings-panel .config-item__main {
        flex: 1 1 100%;
        margin: 0;
    }
    /* 功能行的右边只有一个开关，把标题也撑满整行只会把开关挤到第二行去，
       所以这一行保持左右布局，让标题自己让出空间。
       flex-basis 必须取 0 而不是 auto：内核给 .config-item 开了 flex-wrap，
       折行判定发生在收缩之前，用的是「基准尺寸之和」——基准取内容宽度时，
       标题一长（或右边是下拉而不是开关时）就会把控件整个顶到第二行去。
       取 0 之后先是同一行，再由 grow 把剩下的宽度分给标题。
       选择器必须多带一个 .config-item：上面那条 div.config-item > ...:first-child
       的 :first-child 也算一份特异性，不带就跟它打平、按先后顺序输掉。 */
    .b3-dialog__body .some-settings-panel .config-item.some-settings-panel__sub > .config-item__main {
        flex: 1 1 0;
    }
    /* 拿 selector 当开关的功能，那个下拉也在功能行里，同样不许被上面的
       「控件撑满整行」规则挤到第二行去：让它在标题让出空间之后占满剩余宽度。
       选择器多一级（带 __sub），不论样式表顺序如何都稳定生效。 */
    .b3-dialog__body .some-settings-panel .config-item.some-settings-panel__sub > .b3-select {
        flex: 0 1 auto;
        width: auto;
        min-width: 7rem;
        max-width: 55%;
        margin-top: 0;
    }
    .b3-dialog__body .some-settings-panel .config-item > .fn__space {
        display: none;
    }
    /* 参数行上的控件撑满整行；功能行（__sub）不算参数行，它右边的下拉要留在
       功能名那一行，所以这里把 __sub 排除掉，交给下面那条规则处理。
       少了这个排除，同样特异性的「撑满整行」会按后来的顺序压掉那条规则。 */
    .b3-dialog__body .some-settings-panel .config-item:not(.some-settings-panel__sub) > .fn__size200:not(.b3-switch),
    .b3-dialog__body .some-settings-panel .config-item > .b3-text-field,
    .b3-dialog__body .some-settings-panel .config-item > .b3-select {
        width: 100%;
        max-width: 100%;
        margin-top: 6px;
    }
    /* 窄屏放不下「左文右按钮」：说明块改回上下布局，按钮撑满整行 ——
       200px 在手机上只剩半屏，两颗各占一半更容易误点 */
    .b3-dialog__body .some-settings-panel .some-settings-panel__note {
        display: block;
    }
    .b3-dialog__body .some-settings-panel .some-settings-panel__note-actions {
        width: auto;
        margin-top: 12px;
    }
    .b3-dialog__body .some-settings-panel .some-settings-panel__note-actions .b3-button {
        width: 100%;
    }
    .b3-dialog__body .some-settings-panel .config-item__number {
        flex-wrap: nowrap;
    }
    .b3-dialog__body .some-settings-panel .config-item__number > .b3-text-field {
        width: auto;
        margin-top: 0;
    }
}
</style>

<!-- 思源主窗口：顶栏 + 停靠栏 + 页签 + 正文 + 状态栏（顶栏条目顺序照 layout/topBar.ts） -->
<div class="toolbar">
    <div class="toolbar__item"><span class="toolbar__text">SiYuan</span><svg class="toolbar__svg"><use xlink:href="#iconDown"></use></svg></div>
    <div class="toolbar__item"><svg><use xlink:href="#iconCloudSucc"></use></svg></div>
    <div class="toolbar__item"><svg><use xlink:href="#iconCalendarPlus"></use></svg></div>
    <div class="toolbar__item"><svg><use xlink:href="#iconRiffCard"></use></svg></div>
    <div class="toolbar__item toolbar__item--disabled"><svg><use xlink:href="#iconBack"></use></svg></div>
    <div class="toolbar__item toolbar__item--disabled"><svg><use xlink:href="#iconForward"></use></svg></div>
    <div id="drag" class="fn__flex-1 fn__ellipsis">一些设置</div>
    <div class="toolbar__item"><svg><use xlink:href="#iconPlugin"></use></svg></div>
    <div class="toolbar__item"><svg><use xlink:href="#iconTerminal"></use></svg></div>
    <div class="toolbar__item"><svg><use xlink:href="#iconSearch"></use></svg></div>
    <div class="toolbar__item"><svg><use xlink:href="#iconLight"></use></svg></div>
    <div class="toolbar__item"><svg><use xlink:href="#iconMore"></use></svg></div>
    <div class="fn__flex">
        <div class="toolbar__item toolbar__item--win"><svg><use xlink:href="#iconMin"></use></svg></div>
        <div class="toolbar__item toolbar__item--win"><svg><use xlink:href="#iconMax"></use></svg></div>
        <div class="toolbar__item toolbar__item--win toolbar__item--close"><svg><use xlink:href="#iconClose"></use></svg></div>
    </div>
</div>
<div class="layout">
    <div class="dock">
        <div class="dock__item dock__item--active"><svg><use xlink:href="#iconFiles"></use></svg></div>
        <div class="dock__item"><svg><use xlink:href="#iconOutline"></use></svg></div>
        <div class="dock__item"><svg><use xlink:href="#iconInbox"></use></svg></div>
        <div class="dock__split"></div>
        <div class="dock__item"><svg><use xlink:href="#iconBookmark"></use></svg></div>
        <div class="dock__item"><svg><use xlink:href="#iconTag"></use></svg></div>
        <div class="dock__split"></div>
        <div class="dock__item"><svg><use xlink:href="#iconSparkles"></use></svg></div>
        <div class="dock__item"><svg><use xlink:href="#iconGraph"></use></svg></div>
    </div>
    <div class="layout__center">
        <ul class="layout-tab-bar">
            <li class="item item--focus">
                <svg class="item__graphic"><use xlink:href="#iconFiles"></use></svg>
                <span class="item__text">一些设置</span>
                <span class="item__close"><svg><use xlink:href="#iconClose"></use></svg></span>
            </li>
        </ul>
        <div class="protyle-mock">
            <div class="protyle-mock__title">一些设置</div>
            <div class="protyle-mock__p">一批可独立启停的桌面端与移动端增强功能和优化后的样式。</div>
        </div>
    </div>
</div>
<div class="status">
    <span class="status__msg">已同步</span>
    <span class="status__counter"><span>1234 字</span><span>42 行</span></span>
</div>

<!-- 设置弹窗：宿主的 Setting 建的 Dialog（宽 768px、高 80vh，面板自己把宽改成 900px） -->
<div class="b3-dialog">
    <div class="b3-dialog__scrim"></div>
    <div role="dialog" aria-modal="true" tabindex="-1" class="b3-dialog__container some-settings-dialog" style="width: 900px; height: 80vh;">
        <div class="b3-dialog__header">一些设置</div>
        <div class="b3-dialog__body">
            <!-- applyDesktopLayout()：内容区零内边距、不滚动，滚动交给每一页 -->
            <div class="b3-dialog__content" style="padding: 0; overflow: hidden;">
                <div class="config some-settings-panel some-settings-panel--tabs">
                    <div class="some-settings-panel__side b3-list b3-list--background">
                        <ul class="some-settings-panel__tabs" role="tablist" tabindex="-1">
                            <li class="b3-list-item some-settings-panel__tab" data-ss-tab="ai" role="tab" tabindex="0">
                                <svg class="b3-list-item__graphic"><use xlink:href="#iconSparkles"></use></svg>
                                <span class="b3-list-item__text">人工智能</span>
                            </li>
                            <li class="b3-list-item some-settings-panel__tab" data-ss-tab="editor" role="tab" tabindex="0">
                                <svg class="b3-list-item__graphic"><use xlink:href="#iconEdit"></use></svg>
                                <span class="b3-list-item__text">编辑器</span>
                            </li>
                            <li class="b3-list-item some-settings-panel__tab" data-ss-tab="doc-tree" role="tab" tabindex="0">
                                <svg class="b3-list-item__graphic"><use xlink:href="#iconFiles"></use></svg>
                                <span class="b3-list-item__text">文档树与页签</span>
                            </li>
                            <li class="b3-list-item some-settings-panel__tab b3-list-item--focus" data-ss-tab="appearance" role="tab" tabindex="0" aria-selected="true">
                                <svg class="b3-list-item__graphic"><use xlink:href="#iconTheme"></use></svg>
                                <span class="b3-list-item__text">界面与外观</span>
                            </li>
                            <li class="b3-list-item some-settings-panel__tab" data-ss-tab="connection" role="tab" tabindex="0">
                                <svg class="b3-list-item__graphic"><use xlink:href="#iconPlugZap"></use></svg>
                                <span class="b3-list-item__text">连接与内核</span>
                            </li>
                            <li class="b3-list-item some-settings-panel__tab" data-ss-tab="settings" role="tab" tabindex="0">
                                <svg class="b3-list-item__graphic"><use xlink:href="#iconSettings"></use></svg>
                                <span class="b3-list-item__text">设置与集市</span>
                            </li>
                            <li class="b3-list-item some-settings-panel__tab" data-ss-tab="plugin" role="tab" tabindex="0">
                                <svg class="b3-list-item__graphic"><use xlink:href="#iconPlugin"></use></svg>
                                <span class="b3-list-item__text">插件自身</span>
                            </li>
                        </ul>
                    </div>
                    <div class="some-settings-panel__views">
                        <div class="some-settings-panel__view fn__none" data-ss-tab-panel="ai" role="tabpanel"><div class="config-items"></div></div>
                        <div class="some-settings-panel__view fn__none" data-ss-tab-panel="editor" role="tabpanel"><div class="config-items"></div></div>
                        <div class="some-settings-panel__view fn__none" data-ss-tab-panel="doc-tree" role="tabpanel"><div class="config-items"></div></div>
                        <div class="some-settings-panel__view" data-ss-tab-panel="appearance" role="tabpanel">
                            <div class="config-items">
                                <!-- 退出确认：没有独立开关，下拉就是开关，留在功能名那一行 -->
                                <div class="fn__flex b3-label config-item some-settings-panel__sub" data-ss-row="exit-confirm::scope">
                                    <div class="fn__flex-1 config-item__main">退出应用前弹窗确认<div class="b3-label__text">退出应用前弹窗确认（主菜单的「退出应用」与设置为「关闭窗口即退出」时的关窗）；从桌面托盘菜单退出时不询问。</div></div>
                                    <span class="fn__space"></span>
                                    <select class="b3-select fn__flex-center fn__size200" data-ss-select="exit-confirm::scope">
                                        <option value="disabled">禁用</option>
                                        <option value="desktop" selected>桌面端</option>
                                        <option value="mobile">移动端</option>
                                        <option value="both">桌面端 + 移动端</option>
                                    </select>
                                </div>

                                <!-- Modal 高斯模糊：功能行（开关跟着功能名走）+ 参数行 -->
                                <label class="fn__flex b3-label config-item some-settings-panel__sub" data-ss-row="modal-blur::enabled">
                                    <div class="fn__flex-1 config-item__main">Modal 高斯模糊<div class="b3-label__text">给弹窗遮罩加高斯模糊，被遮住的编辑区虚化，弹窗本身保持清晰。</div></div>
                                    <span class="fn__space"></span>
                                    <input class="b3-switch fn__flex-center" type="checkbox" data-ss-switch="modal-blur::enabled" aria-label="启用" checked/>
                                </label>
                                <div class="fn__flex b3-label config-item some-settings-panel__child some-settings-panel__child--last" data-ss-row="modal-blur::radius">
                                    <div class="fn__flex-1 config-item__main">模糊半径</div>
                                    <span class="fn__space"></span>
                                    <div class="fn__size200 fn__flex-center fn__flex config-item__number"><input class="b3-text-field fn__flex-1" type="number" data-ss-number="modal-blur::radius" value="10" min="1" max="40" step="1"/><span class="fn__space"></span><span class="config-item__unit ft__on-surface">px</span></div>
                                </div>

                                <!-- 命令面板瘦身 -->
                                <label class="fn__flex b3-label config-item some-settings-panel__sub" data-ss-row="desktop-command-panel-slim::enabled">
                                    <div class="fn__flex-1 config-item__main">桌面端命令面板瘦身<div class="b3-label__text">把桌面端命令面板的宽度缩到思源原生宽度的指定百分比。</div></div>
                                    <span class="fn__space"></span>
                                    <input class="b3-switch fn__flex-center" type="checkbox" data-ss-switch="desktop-command-panel-slim::enabled" aria-label="启用" checked/>
                                </label>
                                <div class="fn__flex b3-label config-item some-settings-panel__child some-settings-panel__child--last" data-ss-row="desktop-command-panel-slim::width">
                                    <div class="fn__flex-1 config-item__main">面板宽度<div class="b3-label__text">占思源原生宽度（80vw）的百分比，50% 即 40vw</div></div>
                                    <span class="fn__space"></span>
                                    <div class="fn__size200 fn__flex-center fn__flex config-item__number"><input class="b3-text-field fn__flex-1" type="number" data-ss-number="desktop-command-panel-slim::width" value="50" min="20" max="100" step="5"/><span class="fn__space"></span><span class="config-item__unit ft__on-surface">%</span></div>
                                </div>

                                <!-- 最后一项：整页最后一行，去分割线 -->
                                <label class="fn__flex b3-label config-item config-item--last-visible some-settings-panel__sub" data-ss-row="devtools-hotkey::enabled">
                                    <div class="fn__flex-1 config-item__main">桌面端 F12 开关开发者工具<div class="b3-label__text">桌面端按 F12 打开或关闭开发者工具，与思源状态栏右键菜单里的入口等效。</div></div>
                                    <span class="fn__space"></span>
                                    <input class="b3-switch fn__flex-center" type="checkbox" data-ss-switch="devtools-hotkey::enabled" aria-label="启用"/>
                                </label>
                            </div>
                        </div>
                        <div class="some-settings-panel__view fn__none" data-ss-tab-panel="connection" role="tabpanel"><div class="config-items"></div></div>
                        <div class="some-settings-panel__view fn__none" data-ss-tab-panel="settings" role="tabpanel"><div class="config-items"></div></div>
                        <div class="some-settings-panel__view fn__none" data-ss-tab-panel="plugin" role="tabpanel"><div class="config-items"></div></div>
                    </div>
                </div>
            </div>
            <!-- 面板没有保存 / 取消，宿主的动作区整块被 fn__none 收起 -->
            <div class="b3-dialog__action fn__none"></div>
        </div>
    </div>
</div>
</body>
</html>
